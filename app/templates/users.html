<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestao de Usuarios - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .users-shell {
        min-height: 100vh;
        padding: 24px;
      }

      .users-container {
        width: min(960px, 100%);
        margin: 0 auto;
      }

      /* -- Top bar -- */
      .users-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .users-topbar-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .users-topbar h1 {
        font-size: 1.35rem;
        margin: 0;
        color: var(--text);
      }

      .topbar-link {
        font-size: 0.85rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }

      .topbar-link:hover {
        color: var(--accent-strong);
      }

      .topbar-btn {
        padding: 8px 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--panel);
        color: var(--text);
        font-size: 0.82rem;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
      }

      .topbar-btn:hover {
        background: var(--bg-strong);
        border-color: var(--border-strong);
      }

      /* -- Alert messages -- */
      .users-alert {
        display: none;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 0.85rem;
        margin-bottom: 20px;
        text-align: center;
      }

      .users-alert.visible {
        display: block;
      }

      .users-alert.success {
        background: rgba(15, 118, 110, 0.08);
        border: 1px solid rgba(15, 118, 110, 0.2);
        color: var(--accent);
      }

      .users-alert.error {
        background: rgba(185, 28, 28, 0.08);
        border: 1px solid rgba(185, 28, 28, 0.2);
        color: var(--error);
      }

      /* -- Create user form card -- */
      .create-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 28px 32px 24px;
        margin-bottom: 28px;
      }

      .create-card h2 {
        font-size: 1rem;
        margin: 0 0 18px;
        color: var(--text);
      }

      .create-form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .create-form .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 160px;
      }

      .create-form label {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .create-form input {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        font-family: inherit;
        background: var(--panel-strong);
        color: var(--text);
        transition: border-color 0.2s;
      }

      .create-form input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .create-btn {
        padding: 10px 22px;
        border: none;
        border-radius: var(--radius-md);
        background: var(--accent);
        color: #fff;
        font-size: 0.88rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        white-space: nowrap;
      }

      .create-btn:hover {
        background: var(--accent-strong);
      }

      .create-btn:active {
        transform: scale(0.97);
      }

      .create-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* -- Users table card -- */
      .table-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .table-card h2 {
        font-size: 1rem;
        margin: 0;
        padding: 20px 28px 14px;
        color: var(--text);
      }

      .users-table-wrap {
        overflow-x: auto;
      }

      .users-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
      }

      .users-table th {
        text-align: left;
        padding: 10px 20px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }

      .users-table td {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

      .users-table tr:last-child td {
        border-bottom: none;
      }

      .users-table tr:hover td {
        background: var(--accent-soft);
      }

      .role-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .role-badge.admin {
        background: rgba(184, 102, 44, 0.12);
        color: var(--warm);
      }

      .role-badge.user {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .empty-msg {
        text-align: center;
        padding: 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="users-shell">
      <div class="users-container">
        <div class="users-topbar">
          <div class="users-topbar-left">
            <h1>Gestao de Usuarios</h1>
            <a href="/" class="topbar-link">Voltar ao painel</a>
          </div>
          <button id="logout-btn" class="topbar-btn">Sair</button>
        </div>

        <div id="alert-success" class="users-alert success"></div>
        <div id="alert-error" class="users-alert error"></div>

        <!-- Create user form -->
        <div class="create-card">
          <h2>Novo Usuario</h2>
          <form id="create-form" class="create-form" autocomplete="off">
            <div class="field">
              <label for="new-name">Nome</label>
              <input type="text" id="new-name" required placeholder="Nome completo" />
            </div>
            <div class="field">
              <label for="new-email">E-mail</label>
              <input type="email" id="new-email" required placeholder="email@exemplo.com" />
            </div>
            <div class="field">
              <label for="new-password">Senha</label>
              <input type="password" id="new-password" required placeholder="Senha" />
            </div>
            <button type="submit" id="create-btn" class="create-btn">Criar</button>
          </form>
        </div>

        <!-- Users table -->
        <div class="table-card">
          <h2>Usuarios Cadastrados</h2>
          <div class="users-table-wrap">
            <table class="users-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Perfil</th>
                  <th>Criado em</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr>
                  <td colspan="5" class="empty-msg">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <script>
      (function () {
        var tbody = document.getElementById("users-tbody");
        var alertSuccess = document.getElementById("alert-success");
        var alertError = document.getElementById("alert-error");
        var createForm = document.getElementById("create-form");
        var createBtn = document.getElementById("create-btn");
        var logoutBtn = document.getElementById("logout-btn");

        function hideAlerts() {
          alertSuccess.classList.remove("visible");
          alertError.classList.remove("visible");
        }

        function showSuccess(msg) {
          hideAlerts();
          alertSuccess.textContent = msg;
          alertSuccess.classList.add("visible");
          setTimeout(function () {
            alertSuccess.classList.remove("visible");
          }, 4000);
        }

        function showError(msg) {
          hideAlerts();
          alertError.textContent = msg;
          alertError.classList.add("visible");
        }

        function formatDate(iso) {
          if (!iso) return "-";
          try {
            var d = new Date(iso);
            return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
          } catch (e) {
            return iso;
          }
        }

        function roleBadge(role) {
          var cls = role === "admin" ? "admin" : "user";
          var span = document.createElement("span");
          span.className = "role-badge " + cls;
          span.textContent = role || "user";
          return span;
        }

        function setEmptyMessage(message) {
          var tr = document.createElement("tr");
          var td = document.createElement("td");
          td.colSpan = 5;
          td.className = "empty-msg";
          td.textContent = message;
          tr.appendChild(td);
          tbody.replaceChildren(tr);
        }

        function appendCell(row, value) {
          var td = document.createElement("td");
          td.textContent = value == null ? "-" : String(value);
          row.appendChild(td);
          return td;
        }

        function renderUsers(users) {
          if (!users.length) {
            setEmptyMessage("Nenhum usuario cadastrado.");
            return;
          }
          var fragment = document.createDocumentFragment();
          for (var i = 0; i < users.length; i++) {
            var u = users[i];
            var tr = document.createElement("tr");
            appendCell(tr, u.id);
            appendCell(tr, u.name);
            appendCell(tr, u.email);
            var roleCell = document.createElement("td");
            roleCell.appendChild(roleBadge(u.role));
            tr.appendChild(roleCell);
            appendCell(tr, formatDate(u.created_at));
            fragment.appendChild(tr);
          }
          tbody.replaceChildren(fragment);
        }

        function loadUsers() {
          fetch("/api/users", { credentials: "same-origin" })
            .then(function (res) {
              if (res.status === 401 || res.status === 302) {
                window.location.href = "/login";
                return;
              }
              if (!res.ok) throw new Error("Erro ao carregar usuarios.");
              return res.json();
            })
            .then(function (data) {
              if (data) renderUsers(data);
            })
            .catch(function (err) {
              showError(err.message);
            });
        }

        createForm.addEventListener("submit", function (e) {
          e.preventDefault();
          hideAlerts();

          var name = document.getElementById("new-name").value.trim();
          var email = document.getElementById("new-email").value.trim();
          var password = document.getElementById("new-password").value;

          if (!name || !email || !password) {
            showError("Preencha todos os campos.");
            return;
          }

          createBtn.disabled = true;
          createBtn.textContent = "Criando...";

          fetch("/api/users", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, email: email, password: password }),
          })
            .then(function (res) {
              if (!res.ok) {
                return res.json().then(function (data) {
                  throw new Error(data.detail || "Erro ao criar usuario.");
                });
              }
              return res.json();
            })
            .then(function () {
              showSuccess("Usuario criado com sucesso!");
              createForm.reset();
              loadUsers();
            })
            .catch(function (err) {
              showError(err.message);
            })
            .finally(function () {
              createBtn.disabled = false;
              createBtn.textContent = "Criar";
            });
        });

        logoutBtn.addEventListener("click", function () {
          fetch("/auth/logout", { method: "POST", credentials: "same-origin" })
            .then(function () {
              window.location.href = "/login";
            });
        });

        loadUsers();
      })();
    </script>
  </body>
</html>
